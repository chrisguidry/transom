[workspace]
resolver = "3"
members = ["server", "test-issuer"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/chrisguidry/transom"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
