# Terraform writes this file from github.com/chrisguidry/.github, and
# writes it again over any change made here. To change it, edit this
# repository's entry in repositories.yaml there.

version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories: ["/"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/server","/gateway"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories: ["/gateway","/site"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      terraform:
        patterns: ["*"]
  - package-ecosystem: gradle
    directories: ["/android"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # Robolectric runs only the framework jar its own release
      # names, so this moves when Robolectric does, by hand.
      - dependency-name: "org.robolectric:android-all-instrumented"
