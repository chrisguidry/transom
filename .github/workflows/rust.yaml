name: Rust

# The workspace's tests, the gateway's and the desktop app's among
# them, and the server's image. ci.yaml calls this workflow when a
# change reaches the Rust workspace or the image's build context, and on
# a run started by hand.
on:
  workflow_call:

permissions: {}

# A called workflow's github.workflow is its caller's name, which every
# area shares, so the group names this workflow itself.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    # The desktop app builds against GTK 4.16 and libadwaita 1.6, which
    # Ubuntu 24.04, ubuntu-latest, does not have.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # The tests start their own Redis with test-redis, in Docker, which
    # the runner has, so CI tests the same way as a developer's machine.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The desktop app links GTK and libadwaita, and its tests and
      # test-desktop's each start a message bus of their own with
      # dbus-daemon.
      - name: Install GTK, libadwaita, and dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev libadwaita-1-dev dbus-daemon
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # The registry and the compiled dependencies, keyed on Cargo.lock
      # and the toolchain, so a run compiles only the workspace's own
      # crates. Only main saves, so no pull request writes a cache that
      # main's runs read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo deny check
      # Every line is covered but the desktop app's GTK code: the files
      # under desktop/src named main.rs, window.rs, screen.rs, and
      # widgets.rs, which build and drive the widgets. Nothing tests the
      # widgets end to end yet, as plan 20 says. The commit hook in
      # .pre-commit-config.yaml leaves out the same files, so a change
      # to this regex is a change to that one.
      - run: cargo llvm-cov --locked --fail-uncovered-lines 0 --show-missing-lines --ignore-filename-regex '/desktop/src/(.+/)?(main|window|screen|widgets)\.rs$'

  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A run step has no token for the Actions cache, which this action
      # exports to the steps after it.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The layers go to the Actions cache, where Publish finds every
      # one and rebuilds nothing.
      - name: Build the image
        env:
          CACHE_FROM: "true"
          CACHE_TO: "true"
        run: docker buildx bake transom

  publish:
    name: Publish
    # Only main publishes, from a push or a run started by hand, and only
    # once every check has passed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [rust, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is the build's time and commit, which sort in build order,
      # so Flux can follow the newest.
      - name: Choose the tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The bake file writes the OCI keys from these variables, which
      # come from the commit, so a rerun of the commit writes the same
      # keys. The metadata file holds the digest of the pushed index,
      # which the attestation names.
      - id: build
        name: Build and push the image
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.tag.outputs.tag }}
          CACHE_FROM: "true"
        run: |
          CREATED=$(git log -1 --format=%cI) \
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          docker buildx bake transom --push --metadata-file "$RUNNER_TEMP/metadata.json"
          echo "digest=$(jq -r '.transom["containerimage.digest"]' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
