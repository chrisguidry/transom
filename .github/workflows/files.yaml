name: Files

# The file-length limit and the workflow audit. ci.yaml calls this
# workflow for every change.

on:
  workflow_call:

permissions: {}

# A called workflow's github.workflow is its caller's name, which every
# area shares, so the group names this workflow itself.
concurrency:
  group: files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files:
    name: Files and workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uvx loq@0.2.0 check
      - run: uvx zizmor@1.32.0 --format github .
        env:
          GH_TOKEN: ${{ github.token }}
