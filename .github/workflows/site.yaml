name: Site

# transom.sh, served by GitHub Pages. Every run packs site/public/ as
# the Pages artifact and checks that it holds
# .well-known/assetlinks.json, which Android fetches to verify the app's
# sign-in callback as an App Link. A push to main then deploys the
# artifact. Pages serves it as uploaded, with no Jekyll build.

on:
  push:
    branches: [main]
    paths:
      - site/public/**
      - .github/workflows/site.yaml
  pull_request:
    paths:
      - site/public/**
      - .github/workflows/site.yaml

permissions: {}

# A deploy that is cancelled halfway leaves Pages on the older build
# until the next push, so only pull requests cancel their older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check assetlinks.json
        run: jq -e 'length > 0' site/public/.well-known/assetlinks.json
      # The action leaves out dotfiles unless told otherwise, and
      # .well-known is one.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public
          include-hidden-files: true
      - name: Check the artifact holds assetlinks.json
        run: tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qx './.well-known/assetlinks.json'

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
