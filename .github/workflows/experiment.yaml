name: Experiment

on:
  pull_request:

permissions: {}

jobs:
  all-skipped:
    name: All skipped
    uses: ./.github/workflows/experiment-called.yaml
    permissions:
      contents: read

  report:
    name: Report
    if: ${{ always() }}
    needs: [all-skipped]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
