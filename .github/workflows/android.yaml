name: Android

# The app's checks. They run only when the Android project or this
# workflow changes.

on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yaml
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wrapper jar runs before any other check, so it must be one
      # that Gradle published.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # ktfmt, Android Lint, the unit tests under Robolectric, and Kover's
      # 100% line coverage, with every dependency checked against
      # gradle/verification-metadata.xml.
      - run: ./gradlew check
