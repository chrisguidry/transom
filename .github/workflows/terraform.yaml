name: Terraform

# Plans gateway/ and site/ for a pull request and applies both on main.
# Google's credentials come from Workload Identity Federation
# (gateway/github_actions.tf): a pull request acts as terraform-plan,
# which reads, and main acts as terraform-apply. The state bucket's keys
# and the Linode token are Actions secrets. gateway.yaml calls the apply
# after each build on main, because the commit it pushes to
# gateway/image.auto.tfvars with GITHUB_TOKEN starts no workflow.

on:
  push:
    branches: [main]
    paths:
      - gateway/**.tf
      - gateway/**.tfvars
      - gateway/.terraform.lock.hcl
      - site/**.tf
      - site/.terraform.lock.hcl
      - .github/workflows/terraform.yaml
  pull_request:
    paths:
      - gateway/**.tf
      - gateway/**.tfvars
      - gateway/.terraform.lock.hcl
      - site/**.tf
      - site/.terraform.lock.hcl
      - .github/workflows/terraform.yaml
  workflow_call:
    secrets:
      LINODE_TOKEN:
        required: true
      TERRAFORM_STATE_ACCESS_KEY_ID:
        required: true
      TERRAFORM_STATE_SECRET_ACCESS_KEY:
        required: true

permissions: {}

# None of these is secret.
env:
  TERRAFORM_VERSION: 1.17.1
  WORKLOAD_IDENTITY_PROVIDER: projects/559659705025/locations/global/workloadIdentityPools/github/providers/transom
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan
    # GitHub gives no OIDC token to a pull request from a fork or from
    # Dependabot, so only a branch of this repository plans.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-plan-${{ github.ref }}
      cancel-in-progress: true
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: terraform-plan@transom-wake.iam.gserviceaccount.com
      - name: Plan gateway/
        working-directory: gateway
        run: |
          terraform init
          terraform plan -lock-timeout=10m
      - name: Plan site/
        working-directory: site
        run: |
          terraform init
          terraform plan -lock-timeout=10m

  apply:
    name: Apply
    # A push to main, or gateway.yaml calling from one.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # One apply at a time, whichever workflow started it, and none
    # cancelled halfway.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
    steps:
      # main as it is now, not the commit that started the run: a run
      # that waited behind another must not apply an older image over the
      # newer one gateway.yaml committed meanwhile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: terraform-apply@transom-wake.iam.gserviceaccount.com
      - name: Apply gateway/
        working-directory: gateway
        run: |
          terraform init
          terraform apply -auto-approve -lock-timeout=10m
      - name: Apply site/
        working-directory: site
        run: |
          terraform init
          terraform apply -auto-approve -lock-timeout=10m
