name: Terraform

# Plans gateway/ and site/ for a pull request and applies both on main.
# Google's credentials come from Workload Identity Federation
# (gateway/github_actions.tf): a pull request acts as terraform-plan,
# which reads, and main acts as terraform-apply. The state bucket's keys,
# the Linode token, and the private key of the transom-pages GitHub App
# are Actions secrets. The gateway's image is not Terraform's to set:
# gateway.yaml deploys each build. ci.yaml calls this workflow when the
# Terraform in either directory or this workflow changes.

on:
  workflow_call:
    secrets:
      TERRAFORM_STATE_ACCESS_KEY_ID:
        required: true
      TERRAFORM_STATE_SECRET_ACCESS_KEY:
        required: true
      LINODE_TOKEN:
        required: true
      PAGES_APP_PRIVATE_KEY:
        required: true

permissions: {}

# None of these is secret.
env:
  TERRAFORM_VERSION: 1.17.1
  WORKLOAD_IDENTITY_PROVIDER: projects/559659705025/locations/global/workloadIdentityPools/github/providers/transom
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan
    # ci.yaml does not call this workflow for a pull request from a fork
    # or from Dependabot, which GitHub gives no OIDC token.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-plan-${{ github.ref }}
      cancel-in-progress: true
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: terraform-plan@transom-wake.iam.gserviceaccount.com
      - name: Plan gateway/
        working-directory: gateway
        run: |
          terraform init
          terraform plan -lock-timeout=10m
      # site/ manages the repository's Pages settings, which need the
      # Administration permission that no workflow token can carry. The
      # transom-pages GitHub App has it on this repository alone, and
      # this step makes a token of the App's that lasts an hour.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: pages-token
        with:
          client-id: ${{ vars.PAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGES_APP_PRIVATE_KEY }}
          permission-administration: write
      - name: Plan site/
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ steps.pages-token.outputs.token }}
        run: |
          terraform init
          terraform plan -lock-timeout=10m

  apply:
    name: Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # One apply at a time, and none cancelled halfway.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
    steps:
      # main as it is now, not the commit that started the run: a run
      # that waited behind another must not apply an older commit's
      # Terraform over a newer one's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: terraform-apply@transom-wake.iam.gserviceaccount.com
      - name: Apply gateway/
        working-directory: gateway
        run: |
          terraform init
          terraform apply -auto-approve -lock-timeout=10m
      # site/ manages the repository's Pages settings, which need the
      # Administration permission that no workflow token can carry. The
      # transom-pages GitHub App has it on this repository alone, and
      # this step makes a token of the App's that lasts an hour.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: pages-token
        with:
          client-id: ${{ vars.PAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGES_APP_PRIVATE_KEY }}
          permission-administration: write
      - name: Apply site/
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ steps.pages-token.outputs.token }}
        run: |
          terraform init
          terraform apply -auto-approve -lock-timeout=10m
