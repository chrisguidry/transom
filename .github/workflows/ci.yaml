name: CI

# Runs every workflow that checks a change, so that one job can say whether
# all of them passed. The changes job finds the areas a change touches,
# and only those areas' workflows run.
#
# What transom ships is released together, under one tag: the server's
# image, the gateway's image, the Android app, and the desktop app. A push
# to main that touches any of the four releases all four, each built from
# that commit, so one tag names a server and the clients built with it. A
# push that touches none of them, such as one to the plans or the site,
# releases nothing. A release also deploys the site, whose apt repository
# holds the desktop app's newest package.
on:
  push:
    branches: [main]
  pull_request:
  # For a push to main whose run GitHub never started. It releases all
  # four, as that push would have, and deploys the site for the release's
  # apt repository, but not Terraform.
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # Each output is named for the job below that calls the area's
    # workflow, which all-checks-passed relies on.
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      android: ${{ steps.areas.outputs.android }}
      desktop: ${{ steps.areas.outputs.desktop }}
      gateway: ${{ steps.areas.outputs.gateway }}
      site: ${{ steps.areas.outputs.site }}
      terraform: ${{ steps.areas.outputs.terraform }}
      # Whether this run releases, and the tag every part of the release
      # carries: the run's time and the commit, which sort in build order,
      # so Flux, Obtainium, and apt can each follow the newest.
      release: ${{ steps.areas.outputs.release }}
      tag: ${{ steps.areas.outputs.tag }}
    steps:
      # A pull request checks out its merge commit, whose first parent is
      # the base branch, so the two commits hold the whole change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Each area is a list of git pathspecs. With GIT_GLOB_PATHSPECS, *
      # stops at a slash and ** crosses any number of directories, as in a
      # workflow's paths filter, and :! excludes. A push compares main
      # before and after it. A push whose earlier commit is all zeros or
      # cannot be fetched runs every area, and so does a run started by
      # hand.
      - id: areas
        name: Find the areas the change touches
        env:
          GIT_GLOB_PATHSPECS: "1"
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # GitHub gives no OIDC token to a pull request from a fork or
          # from Dependabot, so Terraform cannot plan one.
          NO_OIDC: >-
            ${{ github.event_name == 'pull_request'
            && (github.event.pull_request.head.repo.full_name != github.repository
            || github.actor == 'dependabot[bot]') }}
        run: |
          case "$EVENT" in
            pull_request)
              base=HEAD^1
              ;;
            workflow_dispatch)
              base=
              ;;
            push)
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
                echo "::notice::No earlier commit to compare with, so every area runs"
                base=
              else
                base=$BEFORE
              fi
              ;;
          esac

          declare -A touched
          area() {
            local name=$1
            shift
            touched[$name]=false
            if [ -z "$base" ] || ! git diff --quiet "$base" HEAD -- "$@"; then
              touched[$name]=true
            fi
          }

          area rust \
            Cargo.toml Cargo.lock rust-toolchain.toml deny.toml \
            .dockerignore docker-bake.hcl \
            'server/**' 'test-issuer/**' 'test-redis/**' 'gateway/**' \
            'desktop/**' 'test-desktop/**' \
            .github/workflows/ci.yaml .github/workflows/rust.yaml

          # The package holds the app alone. Its tests, which run
          # against the server, are the Rust area's.
          area desktop \
            'desktop/**' \
            Cargo.toml Cargo.lock rust-toolchain.toml \
            .github/workflows/desktop.yaml

          # The app's tests run against the server, test-issuer, and
          # test-redis.
          area android \
            'android/**' 'server/**' 'test-issuer/**' 'test-redis/**' \
            Cargo.toml Cargo.lock rust-toolchain.toml \
            .github/workflows/android.yaml

          # Terraform's files are no input to the image.
          area gateway \
            Cargo.toml Cargo.lock rust-toolchain.toml docker-bake.hcl \
            'gateway/**' \
            ':!gateway/**/*.tf' ':!gateway/**/*.tfvars' ':!gateway/.terraform.lock.hcl' \
            .github/workflows/gateway.yaml

          # The site serves the apt repository that desktop/apt builds.
          area site \
            'site/public/**' 'desktop/apt/**' \
            .github/workflows/site.yaml

          if [ "$NO_OIDC" = true ]; then
            touched[terraform]=false
          else
            area terraform \
              'gateway/**/*.tf' gateway/.terraform.lock.hcl \
              'site/**/*.tf' site/.terraform.lock.hcl \
              .github/workflows/terraform.yaml
          fi

          if [ "$EVENT" = workflow_dispatch ]; then
            touched[site]=false
            touched[terraform]=false
          fi

          # A run on main releases when it touches anything that ships,
          # and then every shipped area runs, touched or not, and so does
          # the site, which publishes the release's package to apt.
          release=false
          if [ "$EVENT" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            for name in rust android desktop gateway; do
              if [ "${touched[$name]}" = true ]; then release=true; fi
            done
          fi
          if [ "$release" = true ]; then
            for name in rust android desktop gateway site; do touched[$name]=true; done
          fi

          for name in "${!touched[@]}"; do
            echo "$name=${touched[$name]}"
          done | sort | tee -a "$GITHUB_OUTPUT"
          {
            echo "release=$release"
            echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          } | tee -a "$GITHUB_OUTPUT"

  files:
    name: Files
    uses: $/.github/workflows/files.yaml
    permissions:
      contents: read

  rust:
    name: Rust
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    uses: $/.github/workflows/rust.yaml
    with:
      release: ${{ needs.changes.outputs.release == 'true' }}
      tag: ${{ needs.changes.outputs.tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  android:
    name: Android
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    uses: $/.github/workflows/android.yaml
    with:
      release: ${{ needs.changes.outputs.release == 'true' }}
      tag: ${{ needs.changes.outputs.tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets:
      TRANSOM_RELEASE_KEYSTORE: ${{ secrets.TRANSOM_RELEASE_KEYSTORE }}
      TRANSOM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TRANSOM_RELEASE_KEYSTORE_PASSWORD }}

  desktop:
    name: Desktop
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    uses: $/.github/workflows/desktop.yaml
    with:
      release: ${{ needs.changes.outputs.release == 'true' }}
      tag: ${{ needs.changes.outputs.tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  gateway:
    name: Gateway
    needs: [changes]
    if: needs.changes.outputs.gateway == 'true'
    uses: $/.github/workflows/gateway.yaml
    with:
      release: ${{ needs.changes.outputs.release == 'true' }}
      tag: ${{ needs.changes.outputs.tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # The site's apt repository holds the package of the newest GitHub
  # release, so in a run that releases, the site waits for the release
  # and names its tag. A run that releases nothing skips the release
  # job, and the site is built with the latest release's package.
  site:
    name: Site
    needs: [changes, release]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.site == 'true'
      && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    uses: $/.github/workflows/site.yaml
    with:
      tag: ${{ needs.release.result == 'success' && needs.changes.outputs.tag || '' }}
    permissions:
      contents: read
      attestations: read
      pages: write
      id-token: write
    secrets:
      TRANSOM_APT_SIGNING_KEY: ${{ secrets.TRANSOM_APT_SIGNING_KEY }}

  terraform:
    name: Terraform
    needs: [changes]
    if: needs.changes.outputs.terraform == 'true'
    uses: $/.github/workflows/terraform.yaml
    permissions:
      contents: read
      id-token: write
    secrets:
      TERRAFORM_STATE_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      TERRAFORM_STATE_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      PAGES_APP_PRIVATE_KEY: ${{ secrets.PAGES_APP_PRIVATE_KEY }}

  # The release itself: the Android app and the desktop app, which their
  # workflows built, signed, and attested, as one GitHub release under
  # the tag the images carry. It runs only when every shipped area's
  # workflow succeeded, so a release is never part of what shipped.
  release:
    name: Release
    needs: [changes, rust, android, desktop, gateway]
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.changes.outputs.tag }}
      SIGNING_CERTIFICATE: ${{ needs.android.outputs.certificate }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Write the checksums
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum "transom-$TAG.apk" "transom-desktop_${TAG}_amd64.deb" > SHA256SUMS
      # A full release, and the repository's latest, so Obtainium offers
      # its APK. gh creates it as a draft, uploads the files, and only
      # then publishes it, which creates the tag.
      - name: Publish the release
        run: |
          apk="transom-$TAG.apk"
          deb="transom-desktop_${TAG}_amd64.deb"
          {
            echo "Built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA, with the server's image \`ghcr.io/$GITHUB_REPOSITORY:$TAG\` and the gateway's \`ghcr.io/$GITHUB_REPOSITORY-gateway:$TAG\`."
            echo
            echo "\`$apk\` is the Android app, signed with the certificate whose SHA-256 fingerprint is"
            echo
            echo "    $SIGNING_CERTIFICATE"
            echo
            echo "\`$deb\` is the Linux desktop app, built on Ubuntu 26.04 for amd64. Installing it adds the apt repository at https://transom.sh/apt, which delivers later releases."
            echo
            echo "To verify either, check its build provenance and its checksum, and for the APK its signing certificate:"
            echo
            echo "    gh attestation verify $apk --repo $GITHUB_REPOSITORY"
            echo "    gh attestation verify $deb --repo $GITHUB_REPOSITORY"
            echo "    sha256sum --check SHA256SUMS"
            echo "    apksigner verify --print-certs $apk"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            "$RUNNER_TEMP/dist/$apk" "$RUNNER_TEMP/dist/$deb" "$RUNNER_TEMP/dist/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

  # The one check main's ruleset requires. It succeeds only when the
  # changes job and Files succeeded and so did every area the change
  # touches, so a job added to or renamed in any of their workflows counts
  # without a change to the ruleset. An area the change does not touch is
  # skipped, and counts as passing. A called workflow whose every job is
  # skipped also reports skipped, so the changes job leaves out an area
  # that cannot run rather than letting this job pass a skip.
  all-checks-passed:
    name: All checks passed
    if: ${{ always() }}
    needs: [changes, files, rust, android, desktop, gateway, site, terraform, release]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail unless every needed workflow succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r '
            .changes.outputs as $touched
            | to_entries[]
            | select(.key == "changes" or .key == "files" or $touched[.key] == "true")
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while read -r line; do echo "::error::$line"; done <<< "$failed"
            exit 1
          fi
