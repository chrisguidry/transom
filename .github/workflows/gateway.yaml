name: Gateway

# The wake-up gateway's image and deployment. Its Rust gates run in
# rust.yaml with the rest of the workspace. ci.yaml calls this workflow
# when a change reaches the image. A pull request builds the image. A
# push to main publishes the image to ghcr.io/chrisguidry/transom-gateway
# and deploys it to Cloud Run. Terraform owns the rest of the service and
# leaves its image alone (gateway/cloud_run.tf).

on:
  workflow_call:

permissions: {}

# Builds on main run one at a time, in order, so the image only moves
# forward. A newer push replaces one still waiting. A called workflow's
# github.workflow is its caller's name, which every area shares, so the
# group names this workflow itself.
concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# None of these is secret.
env:
  IMAGE: ghcr.io/chrisguidry/transom-gateway
  # The same image as Cloud Run pulls it, through the Artifact Registry
  # repository that proxies ghcr.io: Terraform's gateway_image output.
  CLOUD_RUN_IMAGE: us-central1-docker.pkg.dev/transom-wake/ghcr/chrisguidry/transom-gateway
  WORKLOAD_IDENTITY_PROVIDER: projects/559659705025/locations/global/workloadIdentityPools/github/providers/transom

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A run step has no token for the Actions cache, which this action
      # exports to the steps after it.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # Only main writes the cache, so no pull request writes layers
      # that main's builds read.
      - name: Build the image
        env:
          CACHE_FROM: "true"
        run: docker buildx bake transom-gateway

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is the build's time and commit, which sort in build order.
      - id: tag
        name: Choose the tag
        run: |
          TAG="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The bake file writes the OCI keys from these variables, which
      # come from the commit, so a rerun of the commit writes the same
      # keys. The metadata file holds the digest of the pushed index,
      # which the attestation and the deploy name.
      - id: build
        name: Build and push the image
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ env.TAG }}
          CACHE_FROM: "true"
          CACHE_TO: "true"
        run: |
          CREATED=$(git log -1 --format=%cI) \
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          docker buildx bake transom-gateway --push --metadata-file "$RUNNER_TEMP/metadata.json"
          echo "digest=$(jq -r '.["transom-gateway"]["containerimage.digest"]' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Cloud Run pulls the image by its digest, and the tag says which build
  # it is. Each deploy makes a revision, so to roll back, send traffic to
  # an earlier revision or deploy an earlier tag and digest the same way.
  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # gateway-deploy may change this one service and nothing else
      # (gateway/github_actions.tf).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: gateway-deploy@transom-wake.iam.gserviceaccount.com
      - name: Deploy the image to Cloud Run
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          gcloud run services update gateway \
            --project transom-wake \
            --region us-central1 \
            --image "$CLOUD_RUN_IMAGE:$TAG@$DIGEST"
