name: Gateway

# The wake-up gateway's image and deployment. Its Rust gates run in
# ci.yaml with the rest of the workspace. A pull request builds the
# image. A push to main publishes the image to
# ghcr.io/chrisguidry/transom-gateway, then deploys it to the Cloud Run
# service gateway/cloud_run.tf makes, which pulls it from ghcr.io through
# an Artifact Registry repository.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - gateway/**
      - .github/workflows/gateway.yaml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - gateway/**
      - .github/workflows/gateway.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Cloud Run values are gateway/'s Terraform outputs. None of them is
# secret.
env:
  IMAGE: ghcr.io/chrisguidry/transom-gateway
  CLOUD_RUN_IMAGE: us-central1-docker.pkg.dev/transom-wake/ghcr/chrisguidry/transom-gateway
  WORKLOAD_IDENTITY_PROVIDER: projects/559659705025/locations/global/workloadIdentityPools/github/providers/transom
  DEPLOYER: deployer@transom-wake.iam.gserviceaccount.com

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: gateway/Dockerfile
          platforms: linux/amd64
          push: false
          # Only main writes the cache, so no pull request writes layers
          # that main's builds read.
          cache-from: type=gha,scope=gateway

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is the build's time and commit, which sort in build order.
      - name: Choose the tag
        run: echo "TAG=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Only a workflow on main can sign in as the deployer, which may
      # deploy only the gateway's service.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          project_id: transom-wake
          region: us-central1
          service: gateway
          image: ${{ env.CLOUD_RUN_IMAGE }}:${{ env.TAG }}
          skip_default_labels: true
