name: Gateway

# The wake-up gateway's image and deployment. Its Rust gates run in
# ci.yaml with the rest of the workspace. A pull request builds the
# image. A push to main publishes the image to
# ghcr.io/chrisguidry/transom-gateway, commits its tag and digest to
# gateway/image.auto.tfvars on main, and applies Terraform, which
# deploys it to Cloud Run.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - gateway/**
      - docker-bake.hcl
      # Terraform's files are no input to the image, and the commit
      # this workflow makes to image.auto.tfvars must not build again.
      - '!gateway/**.tf'
      - '!gateway/**.tfvars'
      - '!gateway/.terraform.lock.hcl'
      - .github/workflows/gateway.yaml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - gateway/**
      - docker-bake.hcl
      # Terraform's files are no input to the image, and the commit
      # this workflow makes to image.auto.tfvars must not build again.
      - '!gateway/**.tf'
      - '!gateway/**.tfvars'
      - '!gateway/.terraform.lock.hcl'
      - .github/workflows/gateway.yaml

permissions: {}

# Builds on main run one at a time, in order, so the image only moves
# forward. A newer push replaces one still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/chrisguidry/transom-gateway

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A run step has no token for the Actions cache, which this action
      # exports to the steps after it.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # Only main writes the cache, so no pull request writes layers
      # that main's builds read.
      - name: Build the image
        env:
          CACHE_FROM: "true"
        run: docker buildx bake transom-gateway

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is the build's time and commit, which sort in build order.
      - name: Choose the tag
        run: echo "TAG=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The bake file writes the OCI keys from these variables, which
      # come from the commit, so a rerun of the commit writes the same
      # keys. The metadata file holds the digest of the pushed index,
      # which the attestation and Terraform name.
      - id: build
        name: Build and push the image
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ env.TAG }}
          CACHE_FROM: "true"
          CACHE_TO: "true"
        run: |
          CREATED=$(git log -1 --format=%cI) \
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          docker buildx bake transom-gateway --push --metadata-file "$RUNNER_TEMP/metadata.json"
          echo "digest=$(jq -r '.["transom-gateway"]["containerimage.digest"]' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The bot's commit goes straight to main, as an image update would.
      - name: Commit the image to Terraform
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > gateway/image.auto.tfvars <<EOF
          # The gateway's image. The gateway workflow rewrites this file for each
          # build on main, commits it, and applies.
          gateway_image_tag    = "$TAG"
          gateway_image_digest = "$DIGEST"
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy the gateway's $TAG" gateway/image.auto.tfvars
          remote="https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          # main may have moved since this run checked out; the commit
          # touches only this file, so it rebases cleanly.
          for attempt in 1 2 3; do
            git pull --rebase "$remote" main && git push "$remote" HEAD:main && exit 0
            sleep 5
          done
          exit 1

  deploy:
    name: Deploy
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/terraform.yaml
    secrets:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      TERRAFORM_STATE_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      TERRAFORM_STATE_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      TERRAFORM_GITHUB_TOKEN: ${{ secrets.TERRAFORM_GITHUB_TOKEN }}
