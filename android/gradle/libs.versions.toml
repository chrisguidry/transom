[versions]
activity-compose = "1.13.0"
agp = "9.5.0"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
browser = "1.10.0"
camera = "1.6.2"
commonmark = "0.32.0"
compose-bom = "2026.09.00"
espresso = "3.7.0"
junit = "4.13.2"
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
kover = "0.9.11"
ksp = "2.3.13"
ktfmt = "0.64"
ktfmt-gradle = "0.27.0"
lifecycle = "2.11.0"
okhttp = "5.5.1"
robolectric = "4.17"
room = "2.8.5"
uiautomator = "2.4.0"
work = "2.12.0"
zxing = "3.5.4"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
# Compose's test rule asks for older releases of these two, which call an
# InputManager method that SDK 37 removed.
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
# CameraX shows the preview and hands the frames to ZXing, which reads the
# QR code on the phone, without Google Play services' ML Kit.
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-task-lists = { module = "org.commonmark:commonmark-ext-task-list-items", version.ref = "commonmark" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# activity-compose asks for an older lifecycle, whose lint checks call
# compiler APIs that this lint no longer has, and lint fails on that.
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-coroutines = { module = "com.squareup.okhttp3:okhttp-coroutines", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# The framework jar this Robolectric release runs for SDK 37, named in its
# DefaultSdkProvider. It changes only when Robolectric does.
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version = "17-robolectric-15733970-i7" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-gradle" }
room = { id = "androidx.room", version.ref = "room" }
