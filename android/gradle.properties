# The build fits a 7 GB CI runner, or a laptop that also runs an emulator:
# Kotlin compiles inside the Gradle daemon rather than in a daemon of its
# own, and at most two workers run at once. Lint loads its own copy of the
# Kotlin compiler into the daemon, which needs more than 512 MB of
# metaspace.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
