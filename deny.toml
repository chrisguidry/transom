# cargo-deny's policy for every crate transom depends on.

[graph]
all-features = true

[advisories]
# Any advisory, including an unmaintained or yanked crate, fails the check.
unmaintained = "all"
yanked = "deny"

[licenses]
# Permissive licenses compatible with shipping transom under MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # tracing-attributes still builds on syn 2, while clap and the icu
    # crates have moved to syn 3. Both are compile-time only.
    { crate = "syn@2", reason = "the ecosystem is partway through moving to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
