[package]
name = "test-desktop"
version = "0.1.0"
description = "A desktop's notification server, tray host, and keyring for transom's tests, in-process or as a process of its own."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy", "service"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
nix = { version = "0.32.0", default-features = false, features = ["signal"] }
