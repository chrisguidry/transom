[package]
name = "test-issuer"
version = "0.1.0"
description = "A token issuer for transom's tests, in-process or as a process of its own."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
url = "2.5.8"

[dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
