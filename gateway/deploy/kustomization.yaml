# The wake-up gateway's deployment, at https://transom.sh/wake. CI
# publishes this directory as the artifact
# ghcr.io/chrisguidry/transom-gateway-deploy, with the tag below replaced
# by the build's tag, so a cluster that follows the artifact moves the
# manifests and the image in one revision. The cluster chooses the
# namespace, the same one as the site's, whose certificate the Ingress
# shares.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
images:
  - name: ghcr.io/chrisguidry/transom-gateway
    newTag: latest
