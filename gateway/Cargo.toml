[package]
name = "transom-gateway"
version = "0.1.0"
description = "Wakes the official transom app through Firebase Cloud Messaging, for any transom server."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tracing"] }
config = { version = "0.15.27", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
http-body-util = "0.1.5"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
