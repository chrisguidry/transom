[package]
name = "transom"
version = "0.1.0"
description = "Ask a person a question from any program and get the answer back."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "urlencode"] }
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "matched-path", "multipart", "query", "tokio", "tracing"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
fast_qr = { version = "0.14.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jiff = "0.2.39"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs", "use_pem"], default-features = false }
multer = "3.1.0"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
redis = { version = "1.8.1", default-features = false, features = ["aio", "connection-manager", "script", "tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
serde_json = "1.0.154"
sfv = "0.16.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
ulid = "3.0.0"
url = "2.5.8"

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rqrr = { version = "0.11.0", default-features = false }
test-issuer = { path = "../test-issuer" }
test-redis = { path = "../test-redis" }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
