[package]
name = "transom"
version = "0.1.0"
description = "Ask a person a question from any program and get the answer back."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs", "use_pem"], default-features = false }
redis = { version = "1.8.1", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
ulid = "3.0.0"

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
http-body-util = "0.1.5"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
