<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "includeIndicatorStyles": false}'>
  <title>{% block title %}transom{% endblock %}</title>
  <link rel="stylesheet" href="/static/transom.css">
  <link rel="icon" href="/static/transom.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/transom.webmanifest">
  <script src="/static/htmx-2.0.11.min.js" defer></script>
  <script src="/static/htmx-ext-sse-2.2.4.min.js" defer></script>
  <script src="/static/transom.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="/">transom</a>
    {% if let Some(me) = me %}
    <nav>
      <a href="/@{{ me }}/exchanges">Inbox</a>
      <span class="who">@{{ me }}</span>
      <button class="quiet bell" type="button" data-devices="/@{{ me }}/devices" aria-pressed="false" aria-label="Notifications off" title="Notifications off" hidden>
        <svg class="bell-on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <svg class="bell-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M3 3l18 18"/></svg>
      </button>
      <button class="quiet" hx-post="/logout">Sign out</button>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
