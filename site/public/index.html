<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>transom</title>
  <meta name="description" content="Ask a person a question from an agent or your code, and get the answer back.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20x='4'%20y='4'%20width='24'%20height='24'%20rx='3'%20fill='none'%20stroke='%233d5a73'%20stroke-width='3'/%3E%3Cline%20x1='4'%20y1='13'%20x2='28'%20y2='13'%20stroke='%233d5a73'%20stroke-width='3'/%3E%3C/svg%3E">
  <style>
    /* The palette is the web UI's, from server/src/web/static/transom.css,
       so this page and the inbox look like the same thing. */
    :root {
      --paper: #fbfbf9;
      --ink: #23262b;
      --muted: #6c6f75;
      --rule: #e4e3df;
      --accent: #3d5a73;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1b1c1e;
        --ink: #e6e5e2;
        --muted: #9a9b9f;
        --rule: #33353a;
        --accent: #8fb0cc;
      }
    }
    html { background: var(--paper); color: var(--ink); }
    body {
      max-width: 36rem;
      margin: 0 auto;
      padding: 14vh 1.25rem 4rem;
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
    header svg { width: 2.5rem; height: 2.5rem; flex: none; stroke: var(--accent); }
    h1 { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1; margin: 0; }
    p { margin: 0 0 1rem; }
    .lead { font-size: 1.25rem; line-height: 1.5; }
    p { overflow-wrap: break-word; }
    .source {
      margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule);
    }
    .source a { font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="4" y="4" width="24" height="24" rx="3" fill="none" stroke-width="3"/>
      <line x1="4" y1="13" x2="28" y2="13" stroke-width="3"/>
    </svg>
    <h1>transom</h1>
  </header>

  <main>
    <p class="lead">
      Ask a person a question from an agent or your code, and get the
      answer back.
    </p>
    <p>
      Questions arrive as phone notifications you can answer in place.
      transom is a small server you run yourself, with an HTTP API, an
      MCP server, a web inbox, and an Android app.
    </p>
    <p class="source">
      <a href="https://github.com/chrisguidry/transom">github.com/chrisguidry/transom</a>
    </p>
  </main>
</body>
</html>
